<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="DriveControl - Suas metas começam aqui.">

    <title>DriveControl | Início</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/inicio.css">
</head>

<body class="home-page">

    <main class="home-container">

        <!-- LOGOTIPO -->
        <header class="home-header">

            <a href="index.html" class="brand-logo">

                <svg
                    class="brand-icon"
                    viewBox="0 0 120 100"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >

                    <!-- Letra D -->
                    <path
                        d="M18 15H48C70 15 82 29 82 50C82 71 68 85 47 85H18V15Z"
                        stroke="#FFFFFF"
                        stroke-width="12"
                        stroke-linejoin="round"
                    />

                    <!-- Letra C -->
                    <path
                        d="M104 25C96 18 87 15 77 15C55 15 42 29 42 50C42 71 55 85 77 85C87 85 96 82 104 75"
                        stroke="#C49A5A"
                        stroke-width="12"
                        stroke-linecap="square"
                    />

                </svg>

                <span class="brand-name">
                    <span class="brand-drive">DRIVE</span><span class="brand-control">CONTROL</span>
                </span>

                <span class="brand-slogan">
                    Caminho para seus objetivos
                </span>

            </a>

        </header>


        <!-- CONTEÚDO PRINCIPAL -->
        <section class="home-content">

            <!-- VOLANTE DRIVECONTROL -->
            <div class="steering-wheel">

                <svg
                    viewBox="0 0 120 120"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >

                    <!-- Aro externo -->
                    <circle
                        cx="60"
                        cy="60"
                        r="43"
                        stroke="#C49A5A"
                        stroke-width="9"
                    />

                    <!-- Estrutura interna -->
                    <path
                        d="M60 60L60 88"
                        stroke="#C49A5A"
                        stroke-width="10"
                        stroke-linecap="round"
                    />

                    <path
                        d="M60 60L27 48"
                        stroke="#C49A5A"
                        stroke-width="10"
                        stroke-linecap="round"
                    />

                    <path
                        d="M60 60L93 48"
                        stroke="#C49A5A"
                        stroke-width="10"
                        stroke-linecap="round"
                    />

                    <!-- Centro do volante -->
                    <circle
                        cx="60"
                        cy="60"
                        r="13"
                        fill="#C49A5A"
                    />

                    <circle
                        cx="60"
                        cy="60"
                        r="5"
                        fill="#172235"
                    />

                </svg>

            </div>


            <!-- MENSAGEM DE APRESENTAÇÃO -->
            <h1>Suas metas começam aqui.</h1>

            <p>
                Organize seus ganhos, acompanhe sua evolução
                e transforme seus objetivos em conquistas.
            </p>


            <!-- BOTÃO DE ACESSO -->
            <a href="metas.html" class="start-button">

                <span>INICIAR PROJETO</span>

                <span class="button-arrow">→</span>

            </a>

        </section>


        <!-- RODAPÉ -->
        <footer class="home-footer">

            © 2026 DriveControl. Todos os direitos reservados.

        </footer>

    </main>

</body>
</html>
